services:
  stridegpt-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "127.0.0.1:8501:8501"

    # Security settings. No capabilities are added back: Streamlit listens on
    # 8501, an unprivileged port, so NET_BIND_SERVICE isn't needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    # Writable temporary filesystems for Streamlit
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /home/appuser/.streamlit:noexec,nosuid,size=50m
      - /home/appuser/.cache:noexec,nosuid,size=100m

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Environment variables (override with .env file)
    environment:
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
    env_file:
      - .env

    # Run as non-root (matches Dockerfile.ui user)
    user: "1000:1000"

    # Same probe as Dockerfile.ui's HEALTHCHECK. The image ships without curl,
    # so a curl-based check here would mark the container unhealthy forever.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # Restart policy for production
    restart: unless-stopped
