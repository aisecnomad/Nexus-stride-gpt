name: Security Scanning

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run security scans weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv export --frozen --no-dev --no-emit-project -o requirements.lock
          pip install --require-hashes -r requirements.lock
          pip install bandit[toml] pip-audit

      - name: Run Bandit security linter
        run: |
          # Full-fidelity report for the artifact: every severity, never gates.
          bandit -c pyproject.toml -r . -f json -o bandit-report.json || true
          # The gate. -ll -ii fails the job on medium-or-above severity at
          # medium-or-above confidence. Anything quieter stays in the artifact
          # above rather than failing the build.
          bandit -c pyproject.toml -r . -f txt -ll -ii

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          # Full-fidelity report for the artifact, same split as Bandit above.
          pip-audit --desc --format json > pip-audit-report.json || true
          # The gate. pip-audit exits non-zero on any known vulnerability.
          # If a transitive dependency picks up a CVE with no fix available,
          # suppress it here with `--ignore-vuln GHSA-xxxx` and a reason, so the
          # exception lands in a reviewable diff rather than being blanket
          # ignored by continue-on-error.
          pip-audit --desc

      - name: Upload security reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{matrix.language}}"

  docker-security:
    name: Docker Image Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -f Dockerfile.ui -t stride-gpt:${{ github.sha }} .

      - name: Verify runtime imports and exclude build tools
        run: |
          docker run --rm --entrypoint /home/appuser/venv/bin/python stride-gpt:${{ github.sha }} -c '
          import importlib.util
          from pathlib import Path
          import streamlit
          import PIL
          import stride_gpt.core.drawio_parser
          assert importlib.util.find_spec("uv") is None
          assert not any(Path("/home/appuser/venv/bin", name).exists() for name in ("uv", "uvx"))
          '

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stride-gpt:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          # `severity` alone does not apply to SARIF output; without this the
          # Security tab also collects LOW/UNKNOWN base-image findings.
          limit-severities-for-sarif: true
          # Base-image CVEs with no vendor patch cannot be actioned here, and
          # they crowd out the findings that can be.
          ignore-unfixed: true
          # pip ships a CycloneDX SBOM of its own vendored tree. Trivy parses
          # embedded SBOMs, so those pins surface as installed packages
          # (setuptools 70.3.0, msgpack 1.1.2) under a bare `Python` target
          # even though nothing on the filesystem holds them. Both copies of
          # the file are skipped; real site-packages metadata is still scanned.
          skip-files: |
            usr/local/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json
            home/appuser/venv/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy in table format
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stride-gpt:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          skip-files: |
            usr/local/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json
            home/appuser/venv/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  wheel-audit:
    name: Clean wheel installation audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Build and install the wheel with published requirements
        run: |
          uv build --wheel
          uv venv .wheel-audit
          uv pip install --python .wheel-audit/bin/python dist/*.whl
          uv pip check --python .wheel-audit/bin/python
      - name: Audit resolved wheel dependencies
        run: |
          SITE_DIR="$(.wheel-audit/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          uvx pip-audit --strict --path "$SITE_DIR"

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [python-security, secret-scanning, codeql-analysis, dependency-review, docker-security, wheel-audit]
    if: always()

    steps:
      - name: Check security scan results
        env:
          PYTHON_SECURITY: ${{ needs.python-security.result }}
          SECRET_SCANNING: ${{ needs.secret-scanning.result }}
          CODEQL_ANALYSIS: ${{ needs.codeql-analysis.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          DOCKER_SECURITY: ${{ needs.docker-security.result }}
          WHEEL_AUDIT: ${{ needs.wheel-audit.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # The icon has to follow the result. Hardcoding ✅ made a failed scan
          # read as "✅ Secret Scanning: failure", which is how weekly Gitleaks
          # failures went unnoticed.
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⚠️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❔" ;;
            esac
          }
          {
            echo "## Security Scan Summary"
            echo ""
            echo "$(icon "$PYTHON_SECURITY") Python Security: $PYTHON_SECURITY"
            echo "$(icon "$SECRET_SCANNING") Secret Scanning: $SECRET_SCANNING"
            echo "$(icon "$CODEQL_ANALYSIS") CodeQL Analysis: $CODEQL_ANALYSIS"
            echo "$(icon "$DEPENDENCY_REVIEW") Dependency Review: $DEPENDENCY_REVIEW"
            echo "$(icon "$DOCKER_SECURITY") Docker Image Security: $DOCKER_SECURITY"
            echo "$(icon "$WHEEL_AUDIT") Clean wheel audit: $WHEEL_AUDIT"
            echo ""
            echo "View detailed results in the workflow logs and Security tab."
          } >> "$GITHUB_STEP_SUMMARY"
          # Make this a meaningful required check. Event-specific jobs may be
          # skipped, but a failed or cancelled scan must never yield a green gate.
          for result in "$PYTHON_SECURITY" "$SECRET_SCANNING" "$CODEQL_ANALYSIS" "$WHEEL_AUDIT"; do
            test "$result" = success || exit 1
          done
          # Require event-specific checks when they are expected to run. A
          # skipped PR dependency review or expected image scan is not success.
          case "$EVENT_NAME" in
            pull_request)
              test "$DEPENDENCY_REVIEW" = success && test "$DOCKER_SECURITY" = success || exit 1 ;;
            push|workflow_dispatch)
              test "$DEPENDENCY_REVIEW" = skipped && test "$DOCKER_SECURITY" = success || exit 1 ;;
            schedule)
              test "$DEPENDENCY_REVIEW" = skipped && test "$DOCKER_SECURITY" = skipped || exit 1 ;;
            *) exit 1 ;;
          esac
