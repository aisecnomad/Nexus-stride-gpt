# STRIDE-GPT security control catalogue.
#
# The single source of truth for:
#   * the `security_controls` and `ai_controls` reference cards the agent loads
#     (stride_gpt/core/prompts/threat_model/*_controls.md), and
#   * docs/controls-catalog.md and docs/framework-crosswalks.md.
# Those files are generated by scripts/build_control_catalog.py; a test fails
# if they drift from this file. Edit here, then regenerate.
#
# The model only ever chooses control IDs. Framework references are looked up
# from the `mappings` below, so the reports can't contain an invented clause.
# Every mapped reference must exist in its framework's `refs` registry; the
# loader rejects the catalogue otherwise.

catalog_version = "2026.10"

# ---------------------------------------------------------------------------
# Reference cards
# ---------------------------------------------------------------------------
# Each domain is rendered into one of these cards. `when_to_load` becomes the
# card's frontmatter (what list_references shows); `intro` opens its body.

[cards.security_controls]
title = "Security Control Catalogue (identity, data protection, network, logging, application security)"
when_to_load = "Load for almost any subsystem with a traditional software or infrastructure surface (authentication, authorisation, data storage, network exposure, logging, input handling, dependencies) to tag each threat with the catalogue controls that mitigate it. Adds CONTROLS. Framework references (AIUC-1, ISO/IEC 42001, ISO/IEC 27001, EU AI Act) are derived from the control IDs automatically."
intro = "You loaded this card to tag each threat with the controls that would mitigate it. It covers identity and access management, data protection and cryptography, network security, logging and monitoring, and application security."
example = ["IAM-05", "LOG-01"]

[cards.ai_controls]
title = "AI and Agentic Control Catalogue (LLM security, agentic AI, AI governance)"
when_to_load = "Load in addition to security_controls when the subsystem uses LLMs, RAG or embeddings, trains or serves models, or runs agents with tools, memory or delegated credentials. Adds IDs to the same CONTROLS field. Pairs with the genai, agentic and insider_threat cards: those name the risk, this card names the control."
intro = "You loaded this card because the subsystem has language-model or agent behaviour in scope. It adds AI application controls, agentic AI controls, and the AI governance controls that AIUC-1, ISO/IEC 42001 and the EU AI Act expect. Use it alongside security_controls: most AI threats need both a traditional control and an AI-specific one."
example = ["AGT-05", "AI-01"]

